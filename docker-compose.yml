services:
  laudo:
    build: .
    image: laudo-vistoria:2.0.0
    restart: unless-stopped
    # Só na máquina local por padrão. Para expor na rede, ponha um proxy com
    # HTTPS na frente e troque para "8000:8000" — ver docs/producao.md.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Fotos, banco e exportações. É a ÚNICA coisa que precisa de backup.
      LAUDO_DIRETORIO_DADOS: /dados
    volumes:
      - dados:/dados
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/saude"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  dados:
