# Alembic — evolução do esquema.
#
# A PRIMEIRA subida não precisa de migração: app.db.criar_esquema() cria o que
# faltar, para instalar não exigir comando extra. O Alembic entra quando o
# esquema MUDA com dados dentro, que é quando create_all não serve.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/..:%(here)s/../..
# A URL real vem de LAUDO_BANCO_URL, lida em alembic/env.py — não se escreve
# credencial de banco em arquivo versionado.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
